version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: auth_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  mongodb:
    image: mongo:6.0
    container_name: orders_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app_network

  backend:
    build: .
    container_name: node_backend
    restart: always
    ports:
      - "4000:4000"
    environment:

      - ENABLE_WEBSOCKET=true
      - NODE_ENV=development
      # MySQL configuration
      - MYSQL_HOST=mysql
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
      - MYSQL_DATABASE=auth_db
      - MYSQL_PORT=3306
      # MongoDB configuration
      - MONGODB_URI=mongodb://admin:admin123@orders_mongo:27017/orders_db?authSource=admin
      - MONGODB_DB=orders_db
      # Frontend URL
      - FRONTEND_URL=http://localhost:3000
      # Other environment variables
      - JWT_SECRET=your-super-secret-jwt-key-change-this-in-production
      - JWT_EXPIRES_IN=7d
      - SESSION_SECRET=your-session-secret-key-change-this
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mysql
      - mongodb
    networks:
      - app_network
    command: npm run dev

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpassword
      UPLOAD_LIMIT: 128M
    depends_on:
      - mysql
    networks:
      - app_network

  mongodb-express:
    image: mongo-express
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: orders_mongo 
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  mongodb_data: